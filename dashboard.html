<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoteVault – Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-page">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="10" fill="#6c63ff"/>
          <path d="M10 12h16M10 18h10M10 24h12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span>NoteVault</span>
      </div>
    </div>

    <button class="btn-new-note" onclick="openNewNote()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Note
    </button>

    <div class="sidebar-section">
      <p class="sidebar-label">Categories</p>
      <ul class="category-list" id="categoryList">
        <li class="cat-item active" data-cat="all" onclick="filterByCategory('all')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          All Notes
          <span class="count" id="count-all">0</span>
        </li>
        <li class="cat-item" data-cat="personal" onclick="filterByCategory('personal')">
          <span class="cat-dot" style="background:#f59e0b"></span>Personal
          <span class="count" id="count-personal">0</span>
        </li>
        <li class="cat-item" data-cat="work" onclick="filterByCategory('work')">
          <span class="cat-dot" style="background:#3b82f6"></span>Work
          <span class="count" id="count-work">0</span>
        </li>
        <li class="cat-item" data-cat="ideas" onclick="filterByCategory('ideas')">
          <span class="cat-dot" style="background:#10b981"></span>Ideas
          <span class="count" id="count-ideas">0</span>
        </li>
        <li class="cat-item" data-cat="urgent" onclick="filterByCategory('urgent')">
          <span class="cat-dot" style="background:#ef4444"></span>Urgent
          <span class="count" id="count-urgent">0</span>
        </li>
      </ul>
    </div>

    <div class="sidebar-footer">
      <div class="user-info" id="userInfo"></div>
      <button class="btn-logout" onclick="handleLogout()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <!-- TOP BAR -->
    <div class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search notes..." oninput="handleSearch()" />
      </div>
      <div class="view-toggle">
        <button id="gridBtn" class="view-btn active" onclick="setView('grid')" title="Grid view">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
        <button id="listBtn" class="view-btn" onclick="setView('list')" title="List view">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- PAGE TITLE -->
    <div class="page-header">
      <h1 id="pageTitle">All Notes</h1>
      <span id="noteCount" class="note-count-badge">0 notes</span>
    </div>

    <!-- NOTES GRID -->
    <div class="notes-grid" id="notesGrid"></div>

    <!-- EMPTY STATE -->
    <div class="empty-state hidden" id="emptyState">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <p>No notes yet.<br/>Click <strong>+ New Note</strong> to get started.</p>
    </div>
  </main>

  <!-- NOTE MODAL -->
  <div class="modal-overlay hidden" id="noteModal">
    <div class="modal">
      <div class="modal-header">
        <input type="text" id="noteTitle" placeholder="Note title..." class="modal-title-input" />
        <button class="modal-close" onclick="closeModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-meta">
        <select id="noteCategory" class="modal-select">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="ideas">Ideas</option>
          <option value="urgent">Urgent</option>
        </select>
        <div class="tags-input-wrap">
          <input type="text" id="tagsInput" placeholder="Add tag + Enter" onkeydown="handleTagInput(event)" />
          <div id="tagsList" class="tags-list"></div>
        </div>
      </div>
      <textarea id="noteContent" placeholder="Write your note here..." class="modal-textarea"></textarea>
      <div class="modal-footer">
        <span id="modalDate" class="modal-date"></span>
        <div class="modal-actions">
          <button class="btn-secondary" id="deleteBtn" onclick="deleteNote()" style="display:none">Delete</button>
          <button class="btn-primary" onclick="saveNote()">Save Note</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="toastOverlay" style="pointer-events:none;"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
