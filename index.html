<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoteVault – Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="logo">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="10" fill="#6c63ff"/>
          <path d="M10 12h16M10 18h10M10 24h12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span>NoteVault</span>
      </div>

      <!-- LOGIN FORM -->
      <div id="loginForm">
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to your notes</p>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" />
        </div>
        <div id="loginError" class="error-msg hidden"></div>
        <button class="btn-primary" onclick="handleLogin()">Sign In</button>
        <p class="switch-link">Don't have an account? <a href="#" onclick="toggleForm('register')">Sign up</a></p>
      </div>

      <!-- REGISTER FORM -->
      <div id="registerForm" class="hidden">
        <h2>Create account</h2>
        <p class="subtitle">Start saving your notes</p>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="regName" placeholder="Your name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Min. 6 characters" />
        </div>
        <div id="registerError" class="error-msg hidden"></div>
        <button class="btn-primary" onclick="handleRegister()">Create Account</button>
        <p class="switch-link">Already have an account? <a href="#" onclick="toggleForm('login')">Sign in</a></p>
      </div>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
